<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Portomatic shared relationship timeline"><title>Portomatic / Relationships</title><link rel="stylesheet" href="/style.css?v=companies-20261019"><script type="module" src="/app.js?v=companies-20261019"></script></head>
<body><main class="dashboard">
  <header><div><a class="brand" href="#timeline">Portomatic</a><span>Relationships</span></div><div class="header-right"><span id="status">Connecting to shared data</span><button id="sync">Refresh</button></div></header>
  <div class="stats" id="stats"></div>
  <nav aria-label="CRM sections"><button data-view="timeline" class="active">Timeline</button><button data-view="people">People</button><button data-view="companies">Companies</button><button data-view="recordings">Recordings</button></nav>
  <div class="toolbar"><label class="search-label"><span class="sr-only">Search people and history</span><input id="search" type="search" placeholder="Search people, companies, conversations…" autocomplete="off"></label><select id="owner" aria-label="Founder"><option value="">Both founders</option></select><select id="kind" aria-label="Touchpoint type"><option value="">All touchpoints</option><option value="email">Email</option><option value="meeting">Meetings</option><option value="recording">Recordings</option><option value="message">Messages</option><option value="connection">LinkedIn connections</option><option value="document">Drive documents</option><option value="note">Notes</option></select></div>
  <div class="company-filters" id="company-filters" hidden><label>Saved list<select id="company-list" aria-label="Saved company list"></select></label><label>Evidence<select id="company-evidence" aria-label="Company evidence"><option>Published product evidence</option><option value="all">All research, including leads and exclusions</option><option>YC description only</option><option>Early access</option><option>Slackbot MCP only</option><option>Unconfirmed lead</option><option>Historical / pivoted</option><option>Coming soon</option></select></label><label>Use case<select id="company-category" aria-label="Company use case"><option value="">All use cases</option></select></label></div>
  <div id="notice" role="status"></div>
  <section id="content" aria-live="polite"><p class="empty">Loading your shared timeline…</p></section>
  <footer><span id="updated"></span></footer>
</main><dialog id="person-dialog"><form id="person-form"><div class="dialog-head"><h2>Person details</h2><button type="button" id="close-dialog" aria-label="Close">×</button></div><input type="hidden" name="id"><label>Name<input name="name" required></label><label>Company<input name="company"></label><label>Relationship<select name="relationship"><option value="unknown">Not classified</option><option value="prospect">Prospect</option><option value="customer">Customer</option><option value="partner">Partner</option><option value="investor">Investor</option><option value="vendor">Vendor</option><option value="founder">Founder</option><option value="other">Other</option></select></label><label>Add email<input name="addEmail" type="email"></label><label>Notes<textarea name="notes" rows="4"></textarea></label><details class="merge-details"><summary>Merge a duplicate person</summary><p>Keep this profile and combine the other person’s timeline, emails and LinkedIn links. Raw source records remain intact.</p><label>Find duplicate<input id="merge-search" type="search" placeholder="Search by name or company"></label><select id="merge-target" aria-label="Duplicate person"><option value="">Choose duplicate</option></select><button type="button" id="merge-person">Merge into this person</button></details><div class="dialog-actions"><button type="submit" class="primary">Save details</button></div></form></dialog></body></html>
